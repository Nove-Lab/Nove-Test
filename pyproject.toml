[project]
name = "novetest"
version = "0.0.0"
description = "AI-first testing orchestration that turns test execution into stored, comparable, reproducible evidence and recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Nove" }]
dependencies = [
    "cyclopts>=3.0",
]

[project.scripts]
novetest = "novetest.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novetest"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "syrupy>=4.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
norecursedirs = ["tests/fixtures"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["novetest"]
