[project]
name = "novetest"
version = "0.3.0"
description = "AI-first testing orchestration that turns test execution into stored, comparable, reproducible evidence and recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nove" }]
dependencies = [
    "cyclopts>=3.0",
    "numpy>=1.26",
]

[project.scripts]
novetest = "novetest.cli.app:main"

# PyPI project-page links, rendered from the first publish. Values pinned
# verbatim by CEO directive `2026-07-07-pypi-publish-directive.md` §2.
[project.urls]
Homepage = "https://ailovestesting.com"
Documentation = "https://ailovestesting.com/docs/novetest/"
Repository = "https://github.com/Nove-Lab/Nove-Test"
Changelog = "https://github.com/Nove-Lab/Nove-Test/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# sdist hygiene: hatchling's default sdist packs the whole tracked tree
# (empirically 494 files incl. 341 under tests/ — fixture SuT projects,
# docs/, scripts/, .github/, uv.lock). The published sdist only needs what
# a wheel rebuild needs: src/ (which carries the vendored _vendor jar +
# THIRD_PARTY_NOTICES.txt), the readme, and the license/NOTICES files.
# pyproject.toml is always included by hatchling. `uv build` proves
# sufficiency on every build by building the wheel FROM this sdist.
# Patterns are git-style: the leading `/` anchors them to the project
# root — unanchored `src` would ALSO match tests/fixtures/projects/*/src.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/NOTICES.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/novetest"]
# Vendored JUnit Platform Console Launcher jar + EPL-2.0 NOTICE file ship
# inside the wheel. The Phase 2.5 JUnit adapter task brief (§1.1)
# prescribed the setuptools `[tool.setuptools.package-data]` directive,
# but this project uses Hatchling — the Hatchling-native equivalent is
# the `force-include` block below, which is explicit even though
# Hatchling would already include these files via the default
# `packages` selection (they live under `src/novetest/...` and are not
# gitignored). Per CEO-approved
# `decisions/2026-06-03-junit-console-launcher-vendor.md` (closes Open
# Question #5). Future vendored adapter helpers follow this same
# `force-include` + `_vendor/THIRD_PARTY_NOTICES.txt` + sibling jar
# pattern.

[tool.hatch.build.targets.wheel.force-include]
"src/novetest/run/adapters/_vendor/junit-platform-console-standalone-1.11.4.jar" = "novetest/run/adapters/_vendor/junit-platform-console-standalone-1.11.4.jar"
"src/novetest/run/adapters/_vendor/THIRD_PARTY_NOTICES.txt" = "novetest/run/adapters/_vendor/THIRD_PARTY_NOTICES.txt"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "syrupy>=4.6",
    "mypy>=1.10",
    "pytest-json-report>=1.5.0",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
norecursedirs = ["tests/fixtures"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["novetest"]
