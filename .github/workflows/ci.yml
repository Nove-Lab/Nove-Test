# CI matrix — closes Phase 0 DoD bullet
# "`uv run pytest -q` green on all three OSes and three Python versions."
#
# Matrix: 3 OS × 3 Python = 9 cells, `minimal` lane (pytest only; no native
# engines beyond the parent Python interpreter are required for the unit /
# integration suites that ship today).
#
# Per-OS gaps (documented per task contract):
#   - windows-arm64: NOT in scope. python-build-standalone / PyApp coverage
#     for windows-arm64 is incomplete; we ship windows-x86_64 only and
#     `windows-latest` GHA runners are x86_64. Tracked in delivery-phasing.md
#     Phase 0 risks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to keep the matrix queue lean.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # Node.js powers the jest Native Engine adapter. Without it the jest
      # integration tests (`test_jest_basic.py` + the jest-coverage slice)
      # skip on every runner. Pin an LTS >= 18 — the jest adapter's readiness
      # hint.
      #
      # Linux + macOS only (`runner.os != 'Windows'`): the jest adapter's
      # subprocess exec passes the bare name `npx`, which Windows CreateProcess
      # does not resolve to the actual `npx.cmd` (PATHEXT is not applied to the
      # exec target). The adapter's readiness guard uses `shutil.which`, which
      # DOES honour PATHEXT — so on Windows the guard passes but the exec then
      # fails with `AdapterInvocationError: npx not found`. Run-CI 26169544419
      # confirmed this on all three windows-latest cells. Until the jest
      # adapter handles `npx.cmd` (Run-team territory — see question
      # release-team-2026-05-20-jest-adapter-windows-npx), Windows omits Node
      # so the adapter's skip guard correctly skips jest there again. jest
      # still runs as a real gate on the six Linux + macOS cells.
      - name: Install Node.js
        if: runner.os != 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install each jest fixture's `node_modules` so the integration tests'
      # `_require_node_and_local_jest()` guard finds a local jest install.
      # Iterate over every fixture carrying a `package.json` instead of
      # hardcoding names — a parallel slice adds `jest-basic-coverage/`.
      # `shell: bash` keeps the loop portable. Windows-skipped to match the
      # `Install Node.js` step above. Runs before `pytest` below.
      - name: Install jest fixture dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for d in tests/fixtures/projects/*/; do
            if [ -f "${d}package.json" ]; then
              echo "npm install: ${d}"
              (cd "${d}" && npm install --no-audit --no-fund)
            fi
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          # Cache uv's resolver + wheel downloads keyed by uv.lock so CI is fast
          # without compromising determinism.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --dev --frozen

      # `uv run pytest -q` is the Phase 0 DoD baseline command (verbatim).
      # We collect both `tests/unit` and `tests/integration` per the
      # `[tool.pytest.ini_options].testpaths` setting in pyproject.toml.
      - name: pytest
        run: uv run pytest -q

      # mypy --strict is required by foundations.md §1 ("Type hints everywhere").
      # Configuration lives in `[tool.mypy]` in pyproject.toml.
      - name: mypy
        run: uv run mypy

      # Release tests exercise `scripts/install.sh` against a localhost HTTP
      # fixture (happy path + tampered-binary mismatch). They live outside
      # `[tool.pytest.ini_options].testpaths` so the default baseline is not
      # affected. Skipped on Windows: install.sh is POSIX sh; Windows parity
      # ships post-MVP via `install.ps1` (delivery-phasing OQ#16).
      - name: pytest (release smoke)
        if: runner.os != 'Windows'
        run: uv run pytest -q tests/release
