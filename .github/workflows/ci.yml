# CI matrix — closes Phase 0 DoD bullet
# "`uv run pytest -q` green on all three OSes and three Python versions."
#
# Matrix: 3 OS × 3 Python = 9 cells, `minimal` lane (pytest only; no native
# engines beyond the parent Python interpreter are required for the unit /
# integration suites that ship today).
#
# Per-OS gaps (documented per task contract):
#   - windows-arm64: NOT in scope. python-build-standalone / PyApp coverage
#     for windows-arm64 is incomplete; we ship windows-x86_64 only and
#     `windows-latest` GHA runners are x86_64. Tracked in delivery-phasing.md
#     Phase 0 risks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to keep the matrix queue lean.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      # Node.js powers the jest Native Engine adapter. Without it the jest
      # integration tests (`test_jest_basic.py` + the jest-coverage slice)
      # skip on every runner. Pin an LTS >= 18 — the jest adapter's readiness
      # hint. Applied to all 9 matrix cells: jest is a real CI gate cross-OS.
      #
      # History: an earlier slice (ci-node-win-fallback) temporarily carried
      # `if: runner.os != 'Windows'` here because the jest adapter execed the
      # bare name `npx`, which Windows CreateProcess cannot resolve to the
      # `npx.cmd` shim. That adapter defect is fixed (commit 0e9ab71 — Windows
      # now launches jest via `cmd /c npx`), so the Windows guard is lifted
      # and jest runs on `windows-latest` again.
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # Go powers the go-test Native Engine adapter. Linux-only: the go
      # integration tests (`test_gotest_*`) run under the `go` require token
      # on the three ubuntu cells (Q1=B, ratified 2026-07-16). macOS/Windows
      # cells stay `pytest,jest` (see the pytest step's require-engines
      # expression). Pin a version >= the go adapter's readiness floor
      # (`run/readiness.py`: "install Go 1.21+"); the go fixtures declare
      # `go 1.21` and are pure-stdlib (no module downloads, no network).
      - name: Install Go
        if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # Install each jest fixture's `node_modules` so the integration tests'
      # `_require_node_and_local_jest()` guard finds a local jest install.
      # Iterate over every fixture carrying a `package.json` instead of
      # hardcoding names — a parallel slice adds `jest-basic-coverage/`.
      # `shell: bash` keeps the loop portable on `windows-latest` (Git Bash),
      # where `run:` steps default to pwsh. Runs before `pytest` below.
      - name: Install jest fixture dependencies
        shell: bash
        run: |
          for d in tests/fixtures/projects/*/; do
            if [ -f "${d}package.json" ]; then
              echo "npm install: ${d}"
              (cd "${d}" && npm install --no-audit --no-fund)
            fi
          done

      # setup-uv@v7 runs on the Node 24 GHA runtime. The `python-version`
      # input is also why the major bump was required: it was added in
      # setup-uv v4 — `@v3` did not recognize it, so passing it emitted an
      # "Unexpected input(s) 'python-version'" warning on every cell. On
      # v7 the input is honoured (it sets `UV_PYTHON`), so the 3x3 Python
      # matrix is kept intact with no separate `actions/setup-python` step.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Cache uv's resolver + wheel downloads keyed by uv.lock so CI is fast
          # without compromising determinism.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --dev --frozen

      # `uv run pytest -q` is the Phase 0 DoD baseline command (verbatim).
      # We collect both `tests/unit` and `tests/integration` per the
      # `[tool.pytest.ini_options].testpaths` setting in pyproject.toml.
      #
      # NOVETEST_REQUIRE_ENGINES promotes engine-gated skips to failures for the
      # engines this job actually equips (XCT-08/09). `pytest` is the parent
      # interpreter (always present); `jest` is installed above via setup-node +
      # the fixture `npm install` step, so the jest run/coverage integration
      # tests MUST run on every cell. `go` is added ONLY on the Linux cells
      # (setup-go is Linux-guarded above; Q1=B, 2026-07-16), so the go-test
      # integration tests (`test_gotest_*`) MUST run there. macOS/Windows keep
      # exactly `pytest,jest` — byte-identical to before. If any required lane
      # silently regresses (npm step breaks, PATH drift, setup-go removed), the
      # build now fails instead of quietly shrinking the skip count. Dormant
      # everywhere the var is unset — the gate itself lives in `tests/conftest.py`.
      - name: pytest
        env:
          NOVETEST_REQUIRE_ENGINES: ${{ runner.os == 'Linux' && 'pytest,jest,go' || 'pytest,jest' }}
        run: uv run pytest -q

      # mypy --strict is required by foundations.md §1 ("Type hints everywhere").
      # Configuration lives in `[tool.mypy]` in pyproject.toml.
      - name: mypy
        run: uv run mypy

      # Release tests exercise `scripts/install.sh` against a localhost HTTP
      # fixture (happy path + tampered-binary mismatch). They live outside
      # `[tool.pytest.ini_options].testpaths` so the default baseline is not
      # affected. Skipped on Windows: install.sh is POSIX sh; Windows parity
      # ships post-MVP via `install.ps1` (delivery-phasing OQ#16).
      - name: pytest (release smoke)
        if: runner.os != 'Windows'
        run: uv run pytest -q tests/release

  # Performance lane — the NFR perf benchmarks under `tests/perf/` (coverage
  # NFR-COV-002 `compare_coverage_facts` at 50k covered locations, plus the
  # localization NFR-LOC-002 derive benchmarks). `tests/perf/` is OUTSIDE
  # `[tool.pytest.ini_options].testpaths` in pyproject.toml — so the `test`
  # job's `uv run pytest -q` never collects it; this lane opts in explicitly
  # with the `tests/perf` path argument.
  #
  # BLOCKING as of S44 (XCT-10): `continue-on-error` is removed, so a budget
  # breach now turns this job — and the whole workflow run — red instead of
  # letting an NFR regression merge unnoticed. This is safe against the
  # ±30-40% wall-clock variance of shared runners because the budgets carry
  # very large headroom: at slice time the measured medians on a comparable
  # host were coverage 0.023s (budget 3.0s), localization sbfl_aggregate
  # 0.029s / failure_proximity 0.016s / sbfl_per_test 0.879s (budget 5.0s,
  # generous NFR ceiling 8.0s). The tightest lane still has >5x margin, so a
  # merely-slow run cannot flake the build; a red here means a real O(n^2)-class
  # regression, not runner noise.
  #
  # NOTE (repo-settings action, out of workflow-content scope): making this
  # job a branch-protection REQUIRED status check must be done in the repo
  # settings by an admin — flagged to the orchestrator/CEO, not attempted here.
  #
  # Single cell: ubuntu-latest / Python 3.13. The benchmarks are pure-Python
  # (they generate fact sets / SBFL inputs programmatically), so no Node.js /
  # jest fixture install is needed — those steps are deliberately omitted.
  # Action majors match the `test` job (`checkout@v6`, `setup-uv@v7`).
  perf:
    name: perf (NFR-COV-002 / NFR-LOC-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --dev --frozen

      # `tests/perf` is passed explicitly — it is not in `testpaths`, so this
      # is the only place the perf benchmark runs.
      - name: pytest (perf benchmark)
        run: uv run pytest tests/perf
