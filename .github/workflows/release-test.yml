# release-test — closes Phase 0 DoD bullets
#   2. "A signed binary builds on the `release-test` workflow."
#   3. "curl -fsSL <release_install_url> | sh end-to-end produces a working
#      novetest --version on a clean Linux container and a clean macOS runner"
#      (this workflow produces the binaries that `scripts/install.sh` then
#      consumes; the curl→sh smoke also runs here, end-to-end.)
#
# "Signed" in the Phase 0 sense means SHA-256-checksum-signed via a `.sha256`
# sidecar. Apple Developer ID / Windows Authenticode codesigning is a post-MVP
# concern (no cert is provisioned yet); the install script's integrity gate is
# the SHA-256 verification on download.
#
# Trigger:
#   - workflow_dispatch (manual; produces unpublished artifacts only)
#   - push of a tag matching v* (produces a draft GitHub Release)
#
# Tier 1 targets:
#   linux-x86_64, linux-aarch64, macos-universal2 (lipo-fused x86_64+arm64),
#   windows-x86_64.
# Windows joined Tier 1 on 2026-06-18; windows-arm64 remains unsupported
# pending a python-build-standalone distribution for it.
#
# All four build cells run under bash — on `windows-latest` that resolves to
# Git Bash (`C:\Program Files\Git\bin\bash.exe`), which ships real `curl`,
# `tar`, `sha256sum`, and `cp`. This keeps the four step bodies structurally
# identical; the only platform-specific divergence is the `matrix.binary_suffix`
# value (".exe" on Windows, "" elsewhere). The PowerShell-native install path
# is exercised separately in the `install-ps1-e2e` job below.

name: release-test

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pyapp_version:
        description: "PyApp version to wrap with (default 0.22.0)"
        required: false
        default: "0.22.0"

permissions:
  contents: write  # required to create / upload to a GitHub Release on tag push

env:
  # Pin PyApp to a known-good version. Bumping requires a fresh end-to-end
  # smoke (binary built → install.sh fetches → `novetest --version` round-trip)
  # on every supported target.
  PYAPP_VERSION_DEFAULT: "0.22.0"
  # PyApp wraps the bundled wheel; first-run latency (5–15s) is the documented
  # tradeoff for not embedding CPython.
  PYAPP_EXEC_SPEC: "novetest.cli.app:main"
  PYAPP_PYTHON_VERSION: "3.11"
  # Linux cells build the PyApp binary INSIDE this container, not on the
  # runner. The produced Rust binary links against the glibc of whatever
  # built it; `ubuntu-latest` is now Ubuntu 24.04 (glibc 2.39), which is why
  # every novetest binary shipped before v0.2.2 refused to start on Debian
  # 11/12, Ubuntu 20.04/22.04, RHEL 8/9, Amazon Linux, and the Debian-12 base
  # of the official `node:*` images. Debian 11 "bullseye" (glibc 2.31) is the
  # build baseline; the image ships a working Rust toolchain so no rustup
  # bootstrap is needed. The `1-bullseye` tag floats on Rust patch releases
  # but its Debian base — and therefore the glibc floor — is fixed forever.
  LINUX_BUILD_IMAGE: "rust:1-bullseye"
  # Hard ceiling on the highest `GLIBC_x.y` version symbol a Linux binary may
  # require, asserted from the artifact itself right after the wrap step. A
  # bullseye build currently lands at 2.30; 2.31 leaves one notch of headroom
  # while still covering every distro in the v0.2.2 support claim. Raising
  # this number is a DELIBERATE narrowing of the supported-host set — it drops
  # distros — so it may only move with a release-notes update saying so.
  LINUX_GLIBC_FLOOR_MAX: "2.31"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Linux cells wrap the wheel inside $LINUX_BUILD_IMAGE (see the
          # `env:` block) rather than on the runner, so the runner's own glibc
          # no longer sets the binary's floor. The runner choice below is now
          # only about CPU architecture: `rust:1-bullseye` is a multi-arch
          # image, so each cell pulls its native variant and cross-compilation
          # is never involved.
          - target: linux-x86_64
            runner: ubuntu-latest
            shell: bash
            binary_suffix: ""
          - target: linux-aarch64
            runner: ubuntu-22.04-arm
            shell: bash
            binary_suffix: ""
          # Single macOS cell ships a universal2 fat binary covering both
          # Apple Silicon and Intel. We build on macos-latest (arm64, never
          # queues) and lipo-fuse two per-arch PyApp wraps. The macos-13
          # runner is intentionally NOT in this matrix — that pool is
          # saturated for hours at a time and GitHub is deprecating it.
          - target: macos-universal2
            runner: macos-latest
            shell: bash
            binary_suffix: ""
          # Windows x86_64 — added 2026-06-18.
          # `shell: bash` resolves to Git Bash on windows-latest, giving us
          # the same POSIX tooling (curl, tar, sha256sum, cp) as the
          # Linux/macOS cells. Cargo build emits `target/release/pyapp.exe`
          # on this runner; the `binary_suffix: ".exe"` matrix value
          # propagates that to every binary-path reference below. The
          # PowerShell-native end-user install path is validated in the
          # separate `install-ps1-e2e` job, which runs install.ps1 under
          # pwsh against the artifact produced by this cell.
          - target: windows-x86_64
            runner: windows-latest
            shell: bash
            binary_suffix: ".exe"

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v6

      # setup-uv@v7 runs on the Node 24 GHA runtime; `@v3` did not, and
      # also predates the `python-version` input (added in v4) used below.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYAPP_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Used by the macOS and Windows cells only. The two Linux cells build
      # inside $LINUX_BUILD_IMAGE, which carries its own toolchain; installing
      # the host toolchain there is a few cached seconds and keeps this step
      # matrix-uniform, so it is deliberately not conditioned away.
      - name: Install Rust toolchain (host)
        uses: dtolnay/rust-toolchain@stable
        with:
          # For macos-universal2 we cross-compile both Apple targets and
          # lipo-fuse. macos-latest is arm64-host, so `aarch64-apple-darwin`
          # is the default triple — we explicitly add it for symmetry and
          # to add `x86_64-apple-darwin` for the cross slice. Empty for
          # every other cell (single native target).
          targets: ${{ matrix.target == 'macos-universal2' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build wheel
        run: |
          uv build --wheel --out-dir dist
          ls -la dist

      # Probe that the built wheel ships NOTICES.md (Apache 2.0 §4(d)
      # attribution surface). Hatchling auto-discovers NOTICES.md as a
      # PEP 639 license file and packs it under
      # `*.dist-info/licenses/NOTICES.md`; if a future Hatchling bump
      # or pyproject.toml edit drops it, this step fails LOUDLY before
      # the PyApp wrap — much cheaper than discovering the omission
      # at release-tag publication time. We use `python -m zipfile`
      # (stdlib) rather than `unzip` because windows-latest's Git Bash
      # does not ship `unzip`. Closes 2026-06-10 v0.1.0 license cycle's
      # Manual Test Recommendation §6.
      - name: Probe wheel NOTICES inclusion
        run: |
          set -euo pipefail
          wheel="$(ls dist/novetest-*-py3-none-any.whl | head -n1)"
          if ! python -m zipfile -l "$wheel" | grep -E 'NOTICES\.(md|txt)'; then
            echo "::error::NOTICES.md missing from built wheel — check pyproject.toml::[tool.hatch.build.targets.wheel] include settings"
            exit 1
          fi
          echo "::notice::NOTICES.md present in wheel ($wheel)"

      - name: Resolve PyApp version
        id: pyapp
        run: |
          ver="${{ github.event.inputs.pyapp_version }}"
          if [ -z "$ver" ]; then
            ver="${PYAPP_VERSION_DEFAULT}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Download PyApp source
        run: |
          set -eu
          ver="${{ steps.pyapp.outputs.version }}"
          curl -fsSL -o pyapp.tar.gz \
            "https://github.com/ofek/pyapp/releases/download/v${ver}/source.tar.gz"
          mkdir -p pyapp-src
          tar -xzf pyapp.tar.gz --strip-components=1 -C pyapp-src
          ls -la pyapp-src | head

      - name: Wrap wheel with PyApp
        env:
          # PyApp reads these env vars at cargo-build time.
          # PYAPP_PROJECT_PATH is exported in the shell body below (must be an
          # absolute path to a single wheel file; not set here because the
          # exact wheel filename is only known after `uv build`).
          PYAPP_PROJECT_NAME: novetest
          PYAPP_EXEC_SPEC: ${{ env.PYAPP_EXEC_SPEC }}
          PYAPP_PYTHON_VERSION: ${{ env.PYAPP_PYTHON_VERSION }}
        run: |
          set -eu
          # Resolve the wheel as an ABSOLUTE path. The subsequent `cd pyapp-src`
          # below would invalidate any relative path before PyApp's build.rs
          # reads PYAPP_PROJECT_PATH (PyApp v0.22.0 panics with
          # "Project path is not a file: dist/novetest-...whl" otherwise).
          wheel="$(ls "$GITHUB_WORKSPACE/dist/"novetest-*-py3-none-any.whl | head -n1)"
          echo "Wrapping wheel: $wheel"
          export PYAPP_PROJECT_PATH="$wheel"
          cd pyapp-src
          mkdir -p ../out
          out_path="../out/novetest-${{ matrix.target }}${{ matrix.binary_suffix }}"
          case "${{ matrix.target }}" in
            macos-universal2)
              # PyApp v0.22.0 does not natively ship a universal2 distribution
              # (python-build-standalone publishes per-arch tarballs only). We
              # build two single-arch PyApp wraps via cargo cross-target and
              # fuse them with `lipo -create`. Each Mach-O slice embeds its
              # arch's python-build-standalone download URL at compile time;
              # at runtime macOS picks the host-matching slice, which then
              # downloads the right CPython on first invocation.
              cargo build --release --target aarch64-apple-darwin
              cargo build --release --target x86_64-apple-darwin
              lipo -create \
                target/aarch64-apple-darwin/release/pyapp \
                target/x86_64-apple-darwin/release/pyapp \
                -output "$out_path"
              # Sanity check: must print "x86_64 arm64" (order may vary).
              lipo -archs "$out_path"
              ;;
            linux-*)
              # Native build for the runner's architecture, but inside Debian
              # 11 so the binary's glibc floor is the CONTAINER's (2.31), not
              # the runner's. Only the cargo invocation is containerized —
              # the wheel build, the sha256 sidecar, the smoke step and every
              # downstream job are untouched.
              #   -u <uid>:<gid>   target/ and the copied artifact stay owned
              #                    by `runner`, so the later steps need no
              #                    sudo. The official rust image marks
              #                    CARGO_HOME/RUSTUP_HOME world-writable, so a
              #                    non-root uid builds fine.
              #   /wheel  read-only mount of dist/; PYAPP_PROJECT_PATH must be
              #           an absolute path to a single wheel file INSIDE the
              #           container, so it is re-expressed against /wheel.
              docker run --rm \
                -u "$(id -u):$(id -g)" \
                -v "$PWD":/src \
                -v "$(dirname "$wheel")":/wheel:ro \
                -w /src \
                -e PYAPP_PROJECT_NAME=novetest \
                -e PYAPP_PROJECT_PATH="/wheel/$(basename "$wheel")" \
                -e PYAPP_EXEC_SPEC="$PYAPP_EXEC_SPEC" \
                -e PYAPP_PYTHON_VERSION="$PYAPP_PYTHON_VERSION" \
                "$LINUX_BUILD_IMAGE" \
                cargo build --release
              cp target/release/pyapp "$out_path"
              ;;
            *)
              # Windows: single-target host build. Cargo emits
              # `target/release/pyapp.exe`; matrix.binary_suffix carries the
              # ".exe" so both source and destination paths agree.
              cargo build --release
              cp "target/release/pyapp${{ matrix.binary_suffix }}" "$out_path"
              ;;
          esac
          ls -la ../out

      # Guard A of the glibc floor (see $LINUX_GLIBC_FLOOR_MAX). Reads the
      # required `GLIBC_x.y` version symbols out of the artifact we just built
      # and refuses anything above the pinned ceiling. This is the cheap,
      # deterministic half — it needs no distro container and it fires the
      # moment a runner-image bump, a base-image bump or a new dependency
      # pulls in a newer symbol. `binary-runs-on-old-glibc` is the other half:
      # it proves the WHOLE chain (this binary + the CPython PyApp downloads
      # at first run) actually starts on an old-glibc host.
      #
      # `objdump` comes from the build container rather than the runner so the
      # guard does not depend on runner-image tooling; the text processing
      # then happens on the host, where quoting stays readable.
      - name: Assert Linux glibc floor (max GLIBC symbol ≤ ${{ env.LINUX_GLIBC_FLOOR_MAX }})
        if: startsWith(matrix.target, 'linux-')
        run: |
          set -eu
          bin="out/novetest-${{ matrix.target }}"
          docker run --rm -v "$PWD/out":/out:ro "$LINUX_BUILD_IMAGE" \
            objdump -T "/out/novetest-${{ matrix.target }}" > /tmp/dynsyms.txt
          observed="$(grep -o 'GLIBC_[0-9][0-9.]*' /tmp/dynsyms.txt \
            | sed 's/^GLIBC_//' | sort -u -V | tail -n1)"
          if [ -z "$observed" ]; then
            echo "::error title=glibc-floor-unmeasurable::found no GLIBC_ version symbols in $bin — the binary is not a dynamically glibc-linked ELF, or objdump output changed shape. Refusing to ship an unmeasured floor."
            exit 1
          fi
          echo "All GLIBC version symbols required by $bin:"
          grep -o 'GLIBC_[0-9][0-9.]*' /tmp/dynsyms.txt | sed 's/^GLIBC_//' | sort -u -V
          # Version-sort the pair; if the ceiling is not the larger of the two,
          # the observed floor exceeds it.
          highest="$(printf '%s\n%s\n' "$observed" "$LINUX_GLIBC_FLOOR_MAX" | sort -V | tail -n1)"
          if [ "$highest" != "$LINUX_GLIBC_FLOOR_MAX" ]; then
            echo "::error title=glibc-floor-raised::$bin requires GLIBC_${observed}, above the allowed ceiling GLIBC_${LINUX_GLIBC_FLOOR_MAX}. Hosts with an older glibc cannot start it AT ALL (the dynamic loader fails before any Python startup) — this is the v0.2.2 regression class. Check what changed the build baseline (LINUX_BUILD_IMAGE, a runner image bump, a new native dependency)."
            exit 1
          fi
          echo "::notice title=glibc-floor::${{ matrix.target }} requires at most GLIBC_${observed} (ceiling GLIBC_${LINUX_GLIBC_FLOOR_MAX})"

      - name: Compute SHA-256 sidecar
        run: |
          set -eu
          cd out
          bin="novetest-${{ matrix.target }}${{ matrix.binary_suffix }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$bin" > "${bin}.sha256"
          else
            # macOS ships `shasum`; emit the same `<hash>  <name>` shape
            # so `sha256sum -c` / `shasum -a 256 -c` both accept it.
            shasum -a 256 "$bin" > "${bin}.sha256"
          fi
          cat "${bin}.sha256"

      - name: Smoke test the binary (`novetest --version`)
        run: |
          set -eu
          ./out/novetest-${{ matrix.target }}${{ matrix.binary_suffix }} --version --output json
          ./out/novetest-${{ matrix.target }}${{ matrix.binary_suffix }} --help --output json | head -c 400

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: novetest-${{ matrix.target }}
          path: |
            out/novetest-${{ matrix.target }}${{ matrix.binary_suffix }}
            out/novetest-${{ matrix.target }}${{ matrix.binary_suffix }}.sha256
          if-no-files-found: error
          retention-days: 14

  # End-to-end install-script smoke. Downloads the just-built linux-x86_64
  # binary via the install script, asserts `novetest --version` works, then
  # re-runs the install script to verify idempotence.
  install-script-e2e:
    name: install.sh end-to-end (linux-x86_64)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download built binary
        uses: actions/download-artifact@v8
        with:
          name: novetest-linux-x86_64
          path: srv

      - name: Serve binary on localhost
        run: |
          set -eu
          # Match the path layout the install script expects:
          #   $BASE_URL/$VERSION/novetest-$TARGET[.sha256]
          mkdir -p www/dev
          cp srv/novetest-linux-x86_64 www/dev/
          cp srv/novetest-linux-x86_64.sha256 www/dev/
          cd www
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          echo $! > /tmp/http.pid
          # Wait until the server is responsive.
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/dev/novetest-linux-x86_64.sha256 >/dev/null; then
              break
            fi
            sleep 0.25
          done

      - name: Run install.sh (clean install)
        env:
          NOVETEST_INSTALL_BASE_URL: "http://127.0.0.1:8000"
          NOVETEST_INSTALL_VERSION: "dev"
          NOVETEST_INSTALL_PREFIX: ${{ runner.temp }}/novetest-install
        run: |
          set -eu
          sh scripts/install.sh
          "$NOVETEST_INSTALL_PREFIX/novetest" --version --output json

      - name: Run install.sh again (idempotent upgrade)
        env:
          NOVETEST_INSTALL_BASE_URL: "http://127.0.0.1:8000"
          NOVETEST_INSTALL_VERSION: "dev"
          NOVETEST_INSTALL_PREFIX: ${{ runner.temp }}/novetest-install
        run: |
          set -eu
          sh scripts/install.sh
          "$NOVETEST_INSTALL_PREFIX/novetest" --version --output json

      - name: Stop HTTP server
        if: always()
        run: |
          if [ -f /tmp/http.pid ]; then kill "$(cat /tmp/http.pid)" || true; fi

  # End-to-end install.ps1 smoke. Parallels install-script-e2e but for the
  # Windows surface — downloads the just-built windows-x86_64 artifact, serves
  # it on localhost, runs install.ps1 (clean + idempotent re-install), asserts
  # `novetest --version` works via the .exe in NOVETEST_INSTALL_PREFIX. This
  # is the load-bearing PowerShell-native evidence for the Tier-1 Windows
  # support claim.
  install-ps1-e2e:
    name: install.ps1 end-to-end (windows-x86_64)
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Download built binary
        uses: actions/download-artifact@v8
        with:
          name: novetest-windows-x86_64
          path: srv

      - name: Serve binary on localhost
        run: |
          New-Item -ItemType Directory -Path "www\dev" -Force | Out-Null
          Copy-Item "srv\novetest-windows-x86_64.exe"        "www\dev\"
          Copy-Item "srv\novetest-windows-x86_64.exe.sha256" "www\dev\"
          Push-Location www
          # Start Python's stdlib http.server in the background; capture the
          # PID at an ABSOLUTE path under RUNNER_TEMP so the cleanup step can
          # find it regardless of its own working directory. `python` is
          # preinstalled on windows-latest.
          $proc = Start-Process -FilePath "python" `
                                -ArgumentList "-m","http.server","8000" `
                                -WindowStyle Hidden -PassThru
          Set-Content -Path "$env:RUNNER_TEMP\http.pid" `
                      -Value $proc.Id -Encoding ascii
          # Wait until the server is responsive (≤10 s).
          for ($i = 0; $i -lt 40; $i++) {
              try {
                  Invoke-WebRequest -Uri "http://127.0.0.1:8000/dev/novetest-windows-x86_64.exe.sha256" `
                                    -UseBasicParsing -TimeoutSec 2 | Out-Null
                  break
              } catch {
                  Start-Sleep -Milliseconds 250
              }
          }
          Pop-Location

      - name: Run install.ps1 (clean install)
        env:
          NOVETEST_INSTALL_BASE_URL: "http://127.0.0.1:8000"
          NOVETEST_INSTALL_VERSION: "dev"
          NOVETEST_INSTALL_PREFIX: ${{ runner.temp }}\novetest-install
        run: |
          & .\scripts\install.ps1
          & "$env:NOVETEST_INSTALL_PREFIX\novetest.exe" --version --output json

      - name: Run install.ps1 again (idempotent upgrade)
        env:
          NOVETEST_INSTALL_BASE_URL: "http://127.0.0.1:8000"
          NOVETEST_INSTALL_VERSION: "dev"
          NOVETEST_INSTALL_PREFIX: ${{ runner.temp }}\novetest-install
        run: |
          & .\scripts\install.ps1
          & "$env:NOVETEST_INSTALL_PREFIX\novetest.exe" --version --output json

      - name: Stop HTTP server
        if: always()
        run: |
          if (Test-Path "$env:RUNNER_TEMP\http.pid") {
              $pidValue = (Get-Content "$env:RUNNER_TEMP\http.pid").Trim()
              if (-not [string]::IsNullOrEmpty($pidValue)) {
                  Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
              }
          }

  # First-run latency bench. PyApp downloads python-build-standalone
  # CPython on the binary's FIRST invocation; that cost is documented
  # as a "5-15 s" budget, acceptable for an install-once CLI. This
  # job pins the budget empirically — every release-test.yml
  # run captures (a) cold first-run wall-clock with a freshly purged
  # PyApp cache, (b) warm second-run wall-clock with the cache primed,
  # (c) the delta. The cold value must stay ≤ 25 s (15 s upper-budget
  # + comfortable GHA network-variance margin); a sustained breach is
  # a regression signal, not bench-tuning noise. Linux-x86_64 only is
  # sufficient: PyApp's CPython download path is structurally
  # identical cross-OS modulo the URL template, and the GHA macOS pool
  # is too slow/queue-prone for a reliable bench.
  first-run-latency-bench:
    name: first-run latency bench (linux-x86_64)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built binary
        uses: actions/download-artifact@v8
        with:
          name: novetest-linux-x86_64
          path: bin

      - name: Make binary executable
        run: chmod +x bin/novetest-linux-x86_64

      - name: Purge any pre-existing PyApp cache (guarantee cold first-run)
        run: |
          set -eu
          # PyApp resolves its data dir via the `dirs` Rust crate, which
          # on Linux follows the XDG spec: $XDG_DATA_HOME or
          # ~/.local/share. We nuke every plausible candidate to defend
          # against future PyApp path-relocation without a workflow
          # update.
          rm -rf \
            "$HOME/.local/share/pyapp" \
            "${XDG_DATA_HOME:-$HOME/.local/share}/pyapp" \
            "$HOME/.cache/pyapp" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/pyapp" \
            || true
          # Surface the post-purge state so a future debugger can see
          # whether any cache directory survived.
          ls -la "$HOME/.local/share/" 2>/dev/null | head -20 || true

      - name: Time cold first-run (`novetest --version`)
        id: cold
        run: |
          set -eu
          start=$(date +%s.%N)
          ./bin/novetest-linux-x86_64 --version --output json > /tmp/cold-out.json
          end=$(date +%s.%N)
          wall=$(awk "BEGIN {printf \"%.3f\", $end - $start}")
          echo "wall=$wall" >> "$GITHUB_OUTPUT"
          echo "Cold first-run wall-clock: ${wall}s"
          echo "--- envelope ---"
          cat /tmp/cold-out.json

      - name: Time warm second-run (`novetest --version`)
        id: warm
        run: |
          set -eu
          start=$(date +%s.%N)
          ./bin/novetest-linux-x86_64 --version --output json > /tmp/warm-out.json
          end=$(date +%s.%N)
          wall=$(awk "BEGIN {printf \"%.3f\", $end - $start}")
          echo "wall=$wall" >> "$GITHUB_OUTPUT"
          echo "Warm second-run wall-clock: ${wall}s"

      - name: Report + assert against the first-run latency budget
        env:
          COLD: ${{ steps.cold.outputs.wall }}
          WARM: ${{ steps.warm.outputs.wall }}
        run: |
          set -eu
          delta=$(awk "BEGIN {printf \"%.3f\", $COLD - $WARM}")
          # ::notice:: shows up in the GHA run summary panel, surfacing
          # the metric at a glance without digging into raw logs.
          echo "::notice title=first-run-latency::cold=${COLD}s warm=${WARM}s delta=${delta}s threshold=25.0s"
          echo "Cold first-run wall (documented budget: 5-15 s): ${COLD}s"
          echo "Warm second-run wall: ${WARM}s"
          echo "Delta (cold - warm, ≈ CPython download cost): ${delta}s"
          if ! awk "BEGIN {exit !($COLD <= 25.0)}"; then
            echo "::error title=first-run-latency-regression::Cold first-run wall ${COLD}s exceeded 25 s budget (documented budget is 5-15 s; 25 s = upper + GHA network variance margin)"
            exit 1
          fi

  # OQ-25 regression gate — the built binary must actually RUN a pytest SuT.
  #
  # Until v0.2.1 the ONLY binary-level exercise in this workflow was
  # `novetest --version` (the build job's smoke step). That is why the
  # v0.2.0 binary shipped unable to run any pytest project at all:
  # readiness probed `sys.executable` — under PyApp the SEALED
  # python-build-standalone CPython, which can never carry pytest — so
  # every pytest SuT false-negatived `engine-misconfigured` (exit 4)
  # before the adapter's venv-first resolution could run. No in-repo
  # `uv run` test can reproduce that condition: the dev venv always has
  # pytest, so novetest's interpreter and the SuT's interpreter are the
  # same process there. Only the real artifact separates them.
  #
  # This job reproduces the deployment condition with the real binary and
  # pins BOTH sides of the documented contract:
  #   positive — a workspace `.venv` carrying pytest is resolved and the
  #              suite actually executes (not merely "readiness passed");
  #   negative — a workspace WITHOUT a `.venv` still yields exit 4 with
  #              the actionable remediation, so a future "fix" cannot
  #              silently widen resolution to a bare-PATH tier.
  #
  # Interpreter resolution is deliberately TWO tiers (workspace `.venv`
  # -> `sys.executable`); see docs/{agent,human}/languages.md.
  binary-runs-pytest-sut:
    name: binary runs a pytest SuT (linux-x86_64)
    needs: build
    runs-on: ubuntu-latest
    env:
      # Exact pin so the engine_version assertion is a string equality
      # rather than a fuzzy match. Bumping this is routine maintenance;
      # the job cross-checks the pin against the venv's real version so a
      # stale pin fails loudly instead of silently passing.
      PYTEST_PIN: "9.1.1"
      BIN: novetest-linux-x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Download built binary
        uses: actions/download-artifact@v8
        with:
          name: novetest-linux-x86_64
          path: bin

      - name: Make binary executable
        run: chmod +x "bin/$BIN"

      - name: Stage two SuT copies outside the repo tree
        run: |
          set -eu
          # tests/fixtures/projects/** is owned by the engine teams and is
          # READ-ONLY here — copy to RUNNER_TEMP and mutate only the copies,
          # so a failed run can never leave the fixture dirty.
          rm -rf "$RUNNER_TEMP/sut-ready" "$RUNNER_TEMP/sut-bare"
          cp -r tests/fixtures/projects/pytest-basic "$RUNNER_TEMP/sut-ready"
          cp -r tests/fixtures/projects/pytest-basic "$RUNNER_TEMP/sut-bare"

          # Copy A: the `.venv` the venv-first rule must resolve against.
          # The fixture deliberately ships NO `.venv`, so the job builds it.
          # pytest-cov is REQUIRED, not optional: `novetest test` collects
          # coverage by default and exits 4 `adapter-missing-plugin`
          # without it — readiness alone gates only pytest + json-report.
          # `python3`, not `python`: this job deliberately does not run
          # setup-uv (it must exercise the artifact, not a dev toolchain),
          # so only the image's system python3 is guaranteed on PATH.
          python3 -m venv "$RUNNER_TEMP/sut-ready/.venv"
          "$RUNNER_TEMP/sut-ready/.venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/sut-ready/.venv/bin/python" -m pip install --quiet \
            "pytest==${PYTEST_PIN}" "pytest-json-report>=1.5.0" "pytest-cov>=5"

          # Copy B: no `.venv` — the documented fallback boundary.
          if [ -e "$RUNNER_TEMP/sut-bare/.venv" ]; then
            echo "::error title=fixture-drift::tests/fixtures/projects/pytest-basic now ships a .venv; the negative assertion below is no longer meaningful"
            exit 1
          fi

          echo "venv pytest: $("$RUNNER_TEMP/sut-ready/.venv/bin/python" -c 'import pytest; print(pytest.__version__)')"

      - name: Initialize a Project Store in both copies
        run: |
          set -eu
          # Every verb other than `init` exits 2 `uninitialized` without a
          # store. `init` does not consult engine readiness, so it exits 0
          # in the bare copy too — keeping the exit-4 assertion below
          # attributable to readiness and nothing else.
          for sut in "$RUNNER_TEMP/sut-ready" "$RUNNER_TEMP/sut-bare"; do
            (cd "$sut" && "$GITHUB_WORKSPACE/bin/$BIN" init --output json)
          done

      - name: Positive — `novetest test` executes the suite (exit 0, all_green 3/3)
        run: |
          set -eu
          cd "$RUNNER_TEMP/sut-ready"
          set +e
          "$GITHUB_WORKSPACE/bin/$BIN" test --output json > "$RUNNER_TEMP/test-ready.json" 2>&1
          rc=$?
          set -e
          echo "--- envelope ---"
          cat "$RUNNER_TEMP/test-ready.json"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=binary-cannot-run-pytest-sut::\`novetest test\` exited $rc (expected 0) on a workspace whose .venv carries pytest ${PYTEST_PIN} — this is the OQ-25 defect class: the binary is not resolving the SuT's interpreter"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/test-ready.json" <<'PY'
          import json
          import sys

          env = json.load(open(sys.argv[1]))
          bad = []
          if env.get("ok") is not True:
              bad.append(f"ok={env.get('ok')!r} (expected True)")
          recs = env.get("data", {}).get("recommendations", [])
          if not recs:
              bad.append("data.recommendations is empty (expected an all_green entry)")
          else:
              rec = recs[0]
              if rec.get("category") != "all_green":
                  bad.append(f"recommendations[0].category={rec.get('category')!r} (expected 'all_green')")
              slots = rec.get("slots", {})
              for key, want in (("passed", 3), ("total_tests", 3)):
                  if slots.get(key) != want:
                      bad.append(f"recommendations[0].slots.{key}={slots.get(key)!r} (expected {want})")
          if bad:
              detail = "; ".join(bad)
              print(
                  "::error title=binary-pytest-suite-did-not-run::"
                  "exit 0 alone does not prove execution — " + detail
              )
              sys.exit(1)
          print("OK: the binary executed the pytest suite, 3/3 green")
          PY

      - name: Positive — `novetest run` reports the pytest that actually ran
        run: |
          set -eu
          cd "$RUNNER_TEMP/sut-ready"
          venv_version="$(.venv/bin/python -c 'import pytest; print(pytest.__version__)')"
          set +e
          "$GITHUB_WORKSPACE/bin/$BIN" run --output json > "$RUNNER_TEMP/run-ready.json" 2>&1
          rc=$?
          set -e
          echo "--- envelope (head) ---"
          head -c 2000 "$RUNNER_TEMP/run-ready.json"
          echo
          if [ "$rc" -ne 0 ]; then
            echo "::error title=binary-run-verb-failed::\`novetest run\` exited $rc (expected 0) on the .venv-carrying workspace"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/run-ready.json" "$PYTEST_PIN" "$venv_version" <<'PY'
          import json
          import sys

          env, pin, venv_version = json.load(open(sys.argv[1])), sys.argv[2], sys.argv[3]
          record = env.get("data", {}).get("memory_entry", {}).get("run_record", {})
          bad = []
          # Three-way equality: the pin, the version really installed in the
          # SuT venv, and the version the envelope reports. The binary's own
          # sealed CPython has NO pytest, so a match here can only come from
          # the resolved venv interpreter (board row 22).
          if venv_version != pin:
              bad.append(
                  f"stale pin: PYTEST_PIN={pin} but the venv installed {venv_version}"
              )
          reported = record.get("engine_version")
          if reported != pin:
              bad.append(
                  f"run_record.engine_version={reported!r} (expected {pin!r}, the SuT venv's pytest)"
              )
          if record.get("status") != "passed":
              bad.append(f"run_record.status={record.get('status')!r} (expected 'passed')")
          counts = record.get("summary_counts", {})
          for key, want in (("passed", 3), ("collected", 3)):
              if counts.get(key) != want:
                  bad.append(f"run_record.summary_counts.{key}={counts.get(key)!r} (expected {want})")
          if bad:
              detail = "; ".join(bad)
              print("::error title=engine-version-inaccurate::" + detail)
              sys.exit(1)
          print(f"OK: engine_version {reported} == SuT venv pytest == pin; 3/3 collected and passed")
          PY

      - name: Negative — no `.venv` still exits 4 with actionable remediation
        run: |
          set -eu
          cd "$RUNNER_TEMP/sut-bare"
          set +e
          "$GITHUB_WORKSPACE/bin/$BIN" test --output json > "$RUNNER_TEMP/test-bare.json" 2>&1
          rc=$?
          set -e
          echo "--- envelope ---"
          cat "$RUNNER_TEMP/test-bare.json"
          if [ "$rc" -ne 4 ]; then
            echo "::error title=resolution-boundary-moved::\`novetest test\` exited $rc (expected 4) on a workspace with NO .venv — resolution is documented as two tiers (workspace .venv -> sys.executable) with no bare-PATH tier; if this widened deliberately, update docs/{agent,human}/languages.md and this job together"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/test-bare.json" <<'PY'
          import json
          import sys

          env = json.load(open(sys.argv[1]))
          bad = []
          errors = env.get("errors", [])
          if not errors:
              bad.append("errors[] is empty (expected engine-misconfigured)")
          elif errors[0].get("code") != "engine-misconfigured":
              bad.append(f"errors[0].code={errors[0].get('code')!r} (expected 'engine-misconfigured')")
          readiness = env.get("data", {}).get("engine_readiness", {})
          if readiness.get("state") != "engine-misconfigured":
              bad.append(f"engine_readiness.state={readiness.get('state')!r} (expected 'engine-misconfigured')")
          # Stable fragments of the shipped remediation. Deliberately NOT the
          # whole string (it names absolute paths and will be reworded); these
          # two carry the load — "the resolved interpreter" is the OQ-25 fix's
          # vocabulary, and the .venv sentence is the only remediation valid
          # under a sealed-CPython binary install.
          issues = " ".join(readiness.get("issues", []))
          for fragment in (
              "pytest is not importable from the resolved interpreter",
              "novetest prefers the workspace's own .venv",
          ):
              if fragment not in issues:
                  bad.append(f"remediation is missing the stable fragment {fragment!r}")
          if bad:
              detail = "; ".join(bad)
              print("::error title=remediation-regressed::" + detail)
              sys.exit(1)
          print("OK: venv-less workspace exits 4 and names the .venv remediation")
          PY

  # Guard B of the glibc floor — the acceptance test for the v0.2.2 fix.
  #
  # Every novetest Linux binary shipped before v0.2.2 (v0.1.2 … v0.2.1)
  # required GLIBC_2.39 and died at the dynamic loader in ~5 ms on any older
  # host — no Python startup, no envelope, just:
  #
  #   novetest.real: /lib/x86_64-linux-gnu/libc.so.6: version `GLIBC_2.39'
  #     not found (required by .../novetest.real)
  #
  # That excluded Debian 11/12, Ubuntu 20.04/22.04 LTS, RHEL/Rocky/Alma 8-9,
  # Amazon Linux 2/2023 and the Debian 12 base of the official `node:*`
  # images. Nothing in this workflow could see it: every job ran the binary on
  # the same modern runner that built it.
  #
  # This job breaks that symmetry — it executes the REAL artifact inside old
  # distro containers with a fresh $HOME, so PyApp's first-run
  # python-build-standalone download happens there too. That matters: the
  # downloaded CPython is itself glibc-linked, so a build-baseline fix that
  # left the runtime unable to start would fix nothing, and only running the
  # whole chain can tell. Guard A (symbol ceiling, in `build`) is the cheap
  # deterministic half; this is the empirical half. Both are required, and
  # both gate the release job.
  binary-runs-on-old-glibc:
    name: binary starts on old glibc (linux-x86_64)
    needs: build
    runs-on: ubuntu-latest
    env:
      BIN: novetest-linux-x86_64
    steps:
      - name: Download built binary
        uses: actions/download-artifact@v8
        with:
          name: novetest-linux-x86_64
          path: bin

      - name: Make binary executable
        run: chmod +x "bin/$BIN"

      # debian:11 "bullseye" (glibc 2.31) is the PUBLISHED FLOOR itself — the
      # only image here that runs the artifact at the number the release notes
      # promise, so a dependency wheel that quietly needs a newer symbol than
      # the wrapper does (Guard A measures the wrapper only) fails here instead
      # of on a user's host. debian:12 "bookworm" (glibc 2.36) is the
      # persona-blocking host and the base of the official Node images;
      # ubuntu:22.04 (glibc 2.35) is the most-deployed LTS. All three must
      # produce an `ok: true` novetest/v1 envelope from the same artifact the
      # release feed will carry.
      - name: Run the artifact under debian:11, debian:12 and ubuntu:22.04
        run: |
          set -eu
          for image in debian:11 debian:12 ubuntu:22.04; do
            echo "===== $image ====="
            # A fresh HOME per image forces PyApp's cold CPython download
            # INSIDE the container, so the downloaded runtime's own glibc
            # requirements are exercised too. /opt/nt (never /bin) keeps the
            # mount clear of the container's own binaries.
            set +e
            docker run --rm \
              -v "$PWD/bin":/opt/nt:ro \
              -e "HOME=/tmp/nt-home" \
              "$image" \
              sh -c "ldd --version | head -n1 >&2; mkdir -p /tmp/nt-home; exec /opt/nt/$BIN --version --output json" \
              > "/tmp/oldglibc-out.json"
            rc=$?
            set -e
            echo "--- envelope ---"
            cat "/tmp/oldglibc-out.json" || true
            echo
            if [ "$rc" -ne 0 ]; then
              echo "::error title=binary-will-not-start-on-old-glibc::the built linux-x86_64 binary exited $rc (expected 0) under $image. If the log above shows \`version \`GLIBC_x.y' not found\`, the build baseline regressed — see LINUX_BUILD_IMAGE. Exit 1 here is NOT a novetest error envelope; the process never reached Python."
              exit 1
            fi
            python3 - "/tmp/oldglibc-out.json" "$image" <<'PY'
          import json
          import sys

          path, image = sys.argv[1], sys.argv[2]
          try:
              env = json.load(open(path))
          except Exception as exc:  # noqa: BLE001 - any parse failure is fatal here
              print(f"::error title=non-json-stdout::{image}: stdout is not JSON ({exc})")
              sys.exit(1)
          bad = []
          if env.get("ok") is not True:
              bad.append(f"ok={env.get('ok')!r} (expected True)")
          schema = env.get("schema")
          if not isinstance(schema, str) or not schema.startswith("novetest/v1"):
              bad.append(f"schema={schema!r} (expected a 'novetest/v1' value)")
          version = env.get("data", {}).get("installedVersion")
          if not isinstance(version, str) or not version:
              bad.append(f"data.installedVersion={version!r} (expected a non-empty version string)")
          if bad:
              print(f"::error title=old-glibc-envelope-invalid::{image}: " + "; ".join(bad))
              sys.exit(1)
          print(f"OK: {image} -> ok=true, schema={schema}, version={version}")
          PY
          done

  # Draft GitHub Release on tag push. Skipped on workflow_dispatch so manual
  # runs do not pollute the release feed.
  release:
    name: draft GitHub Release
    needs: [build, install-script-e2e, install-ps1-e2e, first-run-latency-bench, binary-runs-pytest-sut, binary-runs-on-old-glibc]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f \( -name 'novetest-*' -o -name '*.sha256' \) \
            -exec cp {} release/ \;
          ls -la release

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/novetest-*
            release/novetest-*.sha256
