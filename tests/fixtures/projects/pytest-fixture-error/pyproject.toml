[project]
name = "pytest-fixture-error"
version = "0.0.0"
description = "Nove Test fixture: pytest project whose tests ERROR in a fixture (setup and teardown), so the suite executes but establishes nothing."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytest_fixture_error"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
