[project]
name = "pytest-failing"
version = "0.0.0"
description = "Nove Test fixture: pytest project with one intentional failing test for failed-test capture validation."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytest_failing"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
