[project]
name = "localization-shared-defect"
version = "0.0.0"
description = "Nove Test fixture: pytest project whose single-line defect is shared by passing AND failing tests, so the failing tests' own bodies outscore it under Ochiai."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_defect"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
