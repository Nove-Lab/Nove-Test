[project]
name = "pytest-collection-error"
version = "0.0.0"
description = "Nove Test fixture: pytest project whose test module fails at COLLECTION time, so the suite never executes."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytest_collection_error"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
