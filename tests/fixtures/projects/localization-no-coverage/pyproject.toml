[project]
name = "localization-no-coverage"
version = "0.0.0"
description = "Nove Test fixture: pytest project with a deliberate single-line bug; SBFL falls back to failure_proximity mode because the run is invoked without `--coverage`."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localization_no_coverage"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
