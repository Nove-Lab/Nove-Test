[project]
name = "localization-branch"
version = "0.0.0"
description = "Nove Test fixture: pytest project with a deliberate single-line bug; SBFL ranks the buggy function top-1 under Ochiai."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localization_branch"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
