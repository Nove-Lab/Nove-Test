[project]
name = "flaky-python"
version = "0.0.0"
description = "Nove Test fixture: deliberately flaky pytest project for Replay flakiness detection."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flaky_python"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
